<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 202 206" xmlns="http://www.w3.org/2000/svg" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <clipPath id="tile"><rect x="10" y="10" width="180" height="180" rx="18"/></clipPath>
  </defs>
  <!-- shadow + paper tile -->
  <rect x="15" y="17" width="180" height="180" rx="18" fill="#06101f" fill-opacity="0.45"/>
  <rect x="10" y="10" width="180" height="180" rx="18" fill="#efe3c4"/>
  <g clip-path="url(#tile)">
    <!-- park and harbour -->
    <path d="M118,118 C140,106 170,114 176,136 C182,160 156,172 136,164 C116,156 104,128 118,118 Z" fill="#a9c98a"/>
    <path d="M0,118 C34,108 52,130 86,124 C120,118 132,140 168,138 C190,137 200,130 210,128"
          stroke="#7fb3d5" stroke-width="13"/>
    <!-- minor streets -->
    <g stroke="#d9c79f" stroke-width="3">
      <path d="M10,70 L190,58"/><path d="M60,10 L72,190"/><path d="M140,10 L128,190"/><path d="M10,170 L190,178"/>
    </g>
    <!-- rail: dark line with sleeper dashes -->
    <path d="M24,36 C64,58 96,96 142,158" stroke="#3a2a1e" stroke-width="5"/>
    <path d="M24,36 C64,58 96,96 142,158" stroke="#efe3c4" stroke-width="2" stroke-dasharray="6 6"/>
    <!-- main route -->
    <path d="M50,160 C66,148 46,104 92,92 C138,80 118,40 168,26" stroke="#2a160c" stroke-width="13"/>
    <path d="M50,160 C66,148 46,104 92,92 C138,80 118,40 168,26" stroke="#d9572b" stroke-width="8"/>
    <!-- stops -->
    <circle cx="92" cy="92" r="7" fill="#fffaf0" stroke="#2a160c" stroke-width="4"/>
    <circle cx="168" cy="26" r="7" fill="#fffaf0" stroke="#2a160c" stroke-width="4"/>
  </g>
  <rect x="10" y="10" width="180" height="180" rx="18" stroke="#2a160c" stroke-width="4"/>
  <!-- pin -->
  <g transform="translate(0 -6)">
    <ellipse cx="50" cy="204" rx="13" ry="4" fill="#06101f" fill-opacity="0.35" transform="translate(0 -6)"/>
    <path d="M22,166 c0,-15.5 12.5,-28 28,-28 s28,12.5 28,28 c0,19 -28,40 -28,40 s-28,-21 -28,-40 z"
