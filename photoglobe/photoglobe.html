            { name:'Antarctic Peninsula', h:0.6, w:0.6, s:1.8, pts:[[-63,-65],[-65,-69],[-68,-73]] },
        ];

        // ===================================================================
        // GLOBE: HELPERS
        // ===================================================================

        // Matches THREE.SphereGeometry's default UVs with an equirectangular texture
        // (left edge lon -180, top lat +90). lon 0, lat 0 -> +X; North Pole -> +Y.
        function lonLatToVec3(lon, lat, r, out) {
            const lo = lon * DEG, la = lat * DEG;
            const c = Math.cos(la);
            return out.set(r * c * Math.cos(lo), r * Math.sin(la), -r * c * Math.sin(lo));
        }

        const _ll = [0, 0];
        function vec3ToLonLat(v) {
            const len = Math.sqrt(v.x * v.x + v.y * v.y + v.z * v.z);
            _ll[1] = Math.asin(Math.max(-1, Math.min(1, v.y / len))) / DEG;
            _ll[0] = Math.atan2(-v.z, v.x) / DEG;
            return _ll;
        }

        // Small seeded PRNG so the mountain layout is identical on every load
        function mulberry32(seed) {
            let a = seed >>> 0;
            return function () {
                a = (a + 0x6D2B79F5) >>> 0;
                let t = a;
                t = Math.imul(t ^ (t >>> 15), t | 1);
                t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        // One shared low-poly, snow-capped peak. Unit size: base radius 1 at y=0, apex at y=1.
        function buildPeakGeometry() {
            const N = 6;
            const base = [], snow = [];
            for (let i = 0; i < N; i++) {
                const a = (i / N) * Math.PI * 2;
                const ca = Math.cos(a), sa = Math.sin(a);
                base.push([ca, 0, sa]);
                // Jagged snowline: alternate low/wide and high/narrow vertices
                const even = i % 2 === 0;
                const r = even ? 0.44 : 0.28;
                const y = even ? 0.56 : 0.72;
                snow.push([r * ca, y, r * sa]);
            }
            const apex = [0, 1, 0];
            const cBase = new THREE.Color('#5d4630');
            const cSnowRing = new THREE.Color('#b08d57');
            const cWhite = new THREE.Color('#ffffff');
            const pos = [], col = [];
            function tri(a, ca, b, cb, c, cc) {
                pos.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
                col.push(ca.r, ca.g, ca.b, cb.r, cb.g, cb.b, cc.r, cc.g, cc.b);
            }
            for (let i = 0; i < N; i++) {
                const j = (i + 1) % N;
                // Lower frustum (two triangles per side), counter-clockwise seen from outside
                tri(base[j], cBase, base[i], cBase, snow[i], cSnowRing);
                tri(base[j], cBase, snow[i], cSnowRing, snow[j], cSnowRing);
                // Snow cap fan
                tri(snow[j], cWhite, snow[i], cWhite, apex, cWhite);
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
            geo.computeVertexNormals();
            return geo;
        }

        // Walk a range's spine and return jittered peak placements as lon/lat + size
        function placeRangePeaks(range, rand, out) {
            const pts = range.pts;
            const samples = [];
            if (pts.length === 1) {
                samples.push({ lon: pts[0][0], lat: pts[0][1], t: 0.5, single: true });
            } else {
                const segLen = [];
                let total = 0;
                for (let i = 0; i < pts.length - 1; i++) {
                    const l = d3.geoDistance(pts[i], pts[i + 1]) / DEG;
                    segLen.push(l);
                    total += l;
                }
                const addAt = (dist) => {
                    let seg = 0, start = 0;
                    while (seg < segLen.length - 1 && dist > start + segLen[seg]) {
                        start += segLen[seg];
                        seg++;
                    }
                    const f = segLen[seg] > 0 ? Math.min(1, Math.max(0, (dist - start) / segLen[seg])) : 0;
                    const p = d3.geoInterpolate(pts[seg], pts[seg + 1])(f);
                    samples.push({ lon: p[0], lat: p[1], t: total > 0 ? dist / total : 0.5, single: false });
                };
                let d = 0;
                while (d <= total + 1e-9) {
                    addAt(d);
                    d += range.s;
                }
                if (total - (d - range.s) > range.s * 0.5) addAt(total);
            }

            for (const s of samples) {
                const count = s.single ? 1 : 2;
                for (let k = 0; k < count; k++) {
                    const dx = (rand() * 2 - 1) * range.w;
                    const dy = (rand() * 2 - 1) * range.w;
                    const off = Math.sqrt(dx * dx + dy * dy);
                    const lat = Math.max(-89.9, Math.min(89.9, s.lat + dy));
                    const lon = s.lon + dx / Math.max(0.05, Math.cos(lat * DEG));
                    const height = 0.13 * range.h * (0.55 + 0.45 * rand()) *
                        (0.7 + 0.3 * Math.sin(Math.PI * s.t)) * (1 - 0.35 * off / range.w);
                    const radius = Math.min(0.06, height * (0.55 + 0.2 * rand()));
                    const yaw = rand() * Math.PI * 2;
                    out.push({ lon, lat, height, radius, yaw });
                }
            }
        }

        // ===================================================================
        // GLOBE: MAIN
        // ===================================================================

        async function initGlobe() {
            const globeEl = document.getElementById('globe');
            const loadingEl = document.getElementById('loading');
            const polaroidContainer = document.getElementById('polaroidContainer');

            // ---- Renderer (bail out gracefully without WebGL) ----
            let renderer;
            try {
                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            } catch (err) {
                console.error('WebGL unavailable:', err);
                loadingEl.textContent = 'Sorry, the 3D globe needs WebGL, which is not available in this browser.';
                return;
            }
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            const canvas = renderer.domElement;
            canvas.style.cursor = 'grab';
            globeEl.appendChild(canvas);

            const gl = renderer.getContext();
            const maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);
            const TW = maxTex >= 4096 ? 4096 : 2048;
            const TH = TW / 2;

            // ---- Load country data ----
            let world;
            try {
                world = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json");
            } catch (error) {
                console.error("Error loading map data:", error);
                loadingEl.innerHTML = "Error loading map data. Please check your internet connection.";
                return;
            }
            loadingEl.style.display = "none";
            const features = topojson.feature(world, world.objects.countries).features;

            // ---- Picking id canvas (also used to place waves and trees) ----
            const PW = 2048, PH = 1024;
            const pickProj = d3.geoEquirectangular().fitSize([PW, PH], { type: 'Sphere' });
            const pickCanvas = document.createElement('canvas');
            pickCanvas.width = PW;
            pickCanvas.height = PH;
            const pctx = pickCanvas.getContext('2d', { willReadFrequently: true });
            pctx.imageSmoothingEnabled = false;
            pctx.lineWidth = 1;
            pctx.lineJoin = 'round';
            const pickPath = d3.geoPath(pickProj, pctx);
            features.forEach((f, i) => {
                const id = i + 1;
                const col = 'rgb(' + ((id >> 16) & 255) + ',' + ((id >> 8) & 255) + ',' + (id & 255) + ')';
                pctx.fillStyle = col;
                pctx.strokeStyle = col;
                pctx.beginPath();
                pickPath(f);
                pctx.fill();
                pctx.stroke();
            });
            const pickData = pctx.getImageData(0, 0, PW, PH).data;

            // ---- Scene, camera, lights ----
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
            // Initial direction (lon -40, lat 30); resize() sets the fitted distance
            lonLatToVec3(-40, 30, 3.9, camera.position);
            camera.lookAt(0, 0, 0);
            scene.add(camera);

            // Key light rides on the camera so the lit side always faces the viewer
            const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
            keyLight.position.set(-1.2, 1.4, 1.5);
            camera.add(keyLight);
            scene.add(new THREE.AmbientLight(0xffffff, 0.9));

            // Stepped shading ramp shared by the globe and the peaks
            const gradientMap = new THREE.DataTexture(new Uint8Array([110, 170, 220, 255]), 4, 1, THREE.RedFormat);
            gradientMap.minFilter = THREE.NearestFilter;
            gradientMap.magFilter = THREE.NearestFilter;
            gradientMap.generateMipmaps = false;
            gradientMap.needsUpdate = true;

            // ---- Shared facet set (only used to paint canvases, never added to the scene) ----
            const faces = [];
            {
                const fgeo = new THREE.IcosahedronGeometry(1, 25).toNonIndexed();
                const fp = fgeo.getAttribute('position').array;
                const toLL = (x, y, z) => [
                    Math.atan2(-z, x) / DEG,
                    Math.asin(Math.max(-1, Math.min(1, y))) / DEG
                ];
                for (let i = 0; i < fp.length; i += 9) {
                    let cx = (fp[i] + fp[i + 3] + fp[i + 6]) / 3;
                    let cy = (fp[i + 1] + fp[i + 4] + fp[i + 7]) / 3;
                    let cz = (fp[i + 2] + fp[i + 5] + fp[i + 8]) / 3;
                    const len = Math.sqrt(cx * cx + cy * cy + cz * cz);
                    cx /= len; cy /= len; cz /= len;
                    const cll = toLL(cx, cy, cz);
                    faces.push({
                        a: toLL(fp[i], fp[i + 1], fp[i + 2]),
                        b: toLL(fp[i + 3], fp[i + 4], fp[i + 5]),
                        c: toLL(fp[i + 6], fp[i + 7], fp[i + 8]),
                        lon: cll[0], lat: cll[1], nx: cx, ny: cy, nz: cz
                    });
                }
                fgeo.dispose();
            }

            // Fill (and 1px stroke, to hide hairline seams) one facet on an equirectangular canvas
            function fillFacet(ctx, W, H, f, colour) {
                let a = f.a[0], b = f.b[0], c = f.c[0];
                const wrap = Math.max(a, b, c) - Math.min(a, b, c) > 180;
                if (wrap) {
                    if (a < 0) a += 360;
                    if (b < 0) b += 360;
                    if (c < 0) c += 360;
                }
                const sx = W / 360, sy = H / 180;
                const xa = (a + 180) * sx, xb = (b + 180) * sx, xc = (c + 180) * sx;
                const ya = (90 - f.a[1]) * sy, yb = (90 - f.b[1]) * sy, yc = (90 - f.c[1]) * sy;
                ctx.fillStyle = colour;
                ctx.strokeStyle = colour;
                for (let k = 0; k < (wrap ? 2 : 1); k++) {
                    const off = k ? -W : 0;
                    ctx.beginPath();
                    ctx.moveTo(xa + off, ya);
                    ctx.lineTo(xb + off, yb);
                    ctx.lineTo(xc + off, yc);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }
            }

            function hexRGB(h) {
                const n = parseInt(h.slice(1), 16);
                return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
            }
            // Lighten (f > 1) / darken (f < 1) an [r,g,b] colour, returned as a CSS string
            function shade(rgb, f) {
                const cl = (v) => Math.max(0, Math.min(255, Math.round(v * f)));
                return 'rgb(' + cl(rgb[0]) + ',' + cl(rgb[1]) + ',' + cl(rgb[2]) + ')';
            }

            // ---- Per-country info, cached Path2Ds ----
            const landProj = d3.geoEquirectangular().fitSize([TW, TH], { type: 'Sphere' });
            const info = features.map((f) => {
                const name = (f.properties && f.properties.name) || '';
                const region = regionOfCountry(name);
                const p2d = new Path2D();
                d3.geoPath(landProj, p2d)(f);
                return {
                    name,
                    region,
                    label: EU_SET.has(name) ? 'EU' : name,
                    interactive: INTERACTIVE_REGIONS.has(region),
                    ice: name === 'Greenland' || name === 'Antarctica',
                    path: p2d
                };
            });
            const graticulePath = new Path2D();
            d3.geoPath(landProj, graticulePath)(d3.geoGraticule10());
            const landUnion = new Path2D();
            for (const c of info) landUnion.addPath(c.path);

            const k = TW / 4096;

            // ---- Biomes ----
            const spineX = [], spineY = [], spineZ = [], spineC = [];
            {
                const v = new THREE.Vector3();
                const addSample = (lon, lat, cosT) => {
                    lonLatToVec3(lon, lat, 1, v);
                    spineX.push(v.x); spineY.push(v.y); spineZ.push(v.z); spineC.push(cosT);
                };
                for (const range of RANGES) {
                    const cosT = Math.cos((range.w + 1.3) * DEG);
                    const pts = range.pts;
                    if (pts.length === 1) { addSample(pts[0][0], pts[0][1], cosT); continue; }
                    for (let s = 0; s < pts.length - 1; s++) {
                        const n = Math.max(1, Math.ceil(d3.geoDistance(pts[s], pts[s + 1]) / DEG));
                        const interp = d3.geoInterpolate(pts[s], pts[s + 1]);
                        for (let i = (s === 0 ? 0 : 1); i <= n; i++) {
                            const p = interp(i / n);
                            addSample(p[0], p[1], cosT);
                        }
                    }
                }
            }
            const NSPINE = spineX.length;

            const DESERTS = [[10,23,28,8],[-6,23,11,7],[26,24,10,7],[47,23,9,8],[60,33,8,5],[62,42,10,5],[71,27,3,3],[83,39,7,3],[103,43,10,4],[132,-25,14,7],[22,-24,6,5],[15,-23,2,6],[-70,-23,2,6],[-69,-45,3,7],[-113,34,6,5],[-116,40,4,3],[-104,28,4,4],[46,7,5,5]];
            const HIGHLANDS = [[88,33,11,4],[-67,-19,3,5],[39,9,3,4],[100,47,8,3]];
            const JUNGLES = [[-62,-4,13,8],[22,0,9,5],[102,2,8,6],[114,0,6,5],[141,-5,6,3],[-85,13,5,4],[-5,6,8,2.5]];
            function inEllipses(list, lon, lat) {
                for (let i = 0; i < list.length; i++) {
                    const e = list[i];
                    const dl = ((lon - e[0] + 540) % 360) - 180;
                    const dy = lat - e[1];
                    const u = dl / e[2], w = dy / e[3];
                    if (u * u + w * w < 1) return true;
                }
                return false;
            }
            const _bv = new THREE.Vector3();
            function biomeAt(lon, lat) {
                lonLatToVec3(lon, lat, 1, _bv);
                for (let i = 0; i < NSPINE; i++) {
                    if (_bv.x * spineX[i] + _bv.y * spineY[i] + _bv.z * spineZ[i] >= spineC[i]) return 'foothill';
                }
                if (inEllipses(DESERTS, lon, lat)) return 'desert';
                if (inEllipses(HIGHLANDS, lon, lat)) return 'highland';
                if (inEllipses(JUNGLES, lon, lat)) return 'jungle';
                if (lat >= 0) {
                    if (lat > 69) return 'tundra';
                    const taigaLat = (lon > -11 && lon < 30) ? 58 : 51;
                    if (lat > taigaLat) return 'taiga';
                    if (lat > 28) return 'temperate';
                    return 'savanna';
                }
                if (lat < -58) return 'tundra';
                if (lat < -34) return 'temperate';
                return 'savanna';
            }
            const BIOME_RGB = {
                temperate: hexRGB('#7fb34d'), taiga: hexRGB('#3f7d4e'), tundra: hexRGB('#a8b48c'),
                savanna: hexRGB('#a7b552'), jungle: hexRGB('#2e8b46'), desert: hexRGB('#dcc47e'),
                highland: hexRGB('#b7a36e'), foothill: hexRGB('#8f8757')
            };

            // ---- Sea texture ----
            const seaCanvas = document.createElement('canvas');
            seaCanvas.width = TW;
            seaCanvas.height = TH;
            {
                const sctx = seaCanvas.getContext('2d');
                sctx.fillStyle = '#3a7cc0';
                sctx.fillRect(0, 0, TW, TH);
                sctx.lineWidth = 1;
                sctx.lineJoin = 'round';
                const sr = mulberry32(777001);
                const eq = hexRGB('#3f86cc'), po = hexRGB('#3470b2');
                const ice1 = hexRGB('#eaf3f8'), ice2 = hexRGB('#d9e8f2');
                for (const f of faces) {
                    if (Math.abs(f.lat) > 88) continue;
                    const jit = 1 + (sr() * 2 - 1) * 0.035;
                    const iceN = 79 + (sr() * 2 - 1) * 3;
                    const iceS = -63 + (sr() * 2 - 1) * 3;
                    const pick2 = sr() < 0.5;
                    let col;
                    if (f.lat > iceN || f.lat < iceS) {
                        col = shade(pick2 ? ice1 : ice2, 1);
                    } else {
                        const t = Math.abs(f.lat) / 90;
                        col = shade([eq[0] + (po[0] - eq[0]) * t, eq[1] + (po[1] - eq[1]) * t, eq[2] + (po[2] - eq[2]) * t], jit);
                    }
                    fillFacet(sctx, TW, TH, f, col);
                }
                // Shallow shelves: stepped turquoise bands hugging every coast
                sctx.lineJoin = 'round';
                sctx.strokeStyle = 'rgba(125, 205, 235, 0.22)';
                for (const w of [56, 34, 16]) {
                    sctx.lineWidth = w * k;
                    sctx.stroke(landUnion);
                }
                sctx.lineWidth = 1 * k;
                sctx.strokeStyle = 'rgba(255,255,255,0.10)';
                sctx.stroke(graticulePath);
            }
            const seaTexture = new THREE.CanvasTexture(seaCanvas);
            seaTexture.colorSpace = THREE.SRGBColorSpace;
            seaTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

            // ---- Land base texture (alpha: sea fully transparent), painted once ----
            const landBase = document.createElement('canvas');
            landBase.width = TW;
            landBase.height = TH;
            {
                const bctx = landBase.getContext('2d');
                bctx.lineWidth = 1;
                bctx.lineJoin = 'round';
                const br = mulberry32(777002);
                // c. biome mosaic everywhere
                for (const f of faces) {
                    if (Math.abs(f.lat) > 88) continue;
                    const lo = f.lon + (br() * 2 - 1) * 1.5;
                    const la = f.lat + (br() * 2 - 1) * 1.5;
                    const key = biomeAt(lo, la);
                    fillFacet(bctx, TW, TH, f, shade(BIOME_RGB[key], 1 + (br() * 2 - 1) * 0.07));
                }
                // pre-fill poles so they are never empty
                bctx.fillStyle = shade(BIOME_RGB.tundra, 1);
                bctx.fillRect(0, 0, TW, 2 * TH / 180 * 3);
                bctx.fillStyle = '#dde9f1';
                bctx.fillRect(0, TH - 2 * TH / 180 * 3, TW, 2 * TH / 180 * 3);

                // d. ice sheets
                const icePath = new Path2D();
                for (const c of info) if (c.ice) icePath.addPath(c.path);
                bctx.save();
                bctx.clip(icePath);
                const iceCols = [hexRGB('#f4f8fb'), hexRGB('#dde9f1'), hexRGB('#e8f1f6')];
                const ir = mulberry32(777003);
                for (const f of faces) {
                    if (Math.abs(f.lat) < 58) continue;
                    fillFacet(bctx, TW, TH, f, shade(iceCols[Math.floor(ir() * 3)], 1));
                }
                bctx.restore();
                // fill the pole rows with ice too (Antarctica reaches the bottom edge)
                bctx.fillStyle = '#dde9f1';
                bctx.fillRect(0, TH - 2 * TH / 180 * 3, TW, 2 * TH / 180 * 3);

                // e. dim non-interactive, non-ice countries
                bctx.fillStyle = 'rgba(64, 84, 78, 0.40)';
                for (const c of info) {
                    if (!c.interactive && !c.ice) bctx.fill(c.path);
                }
                // ...and lift the interactive ones slightly so they read as clickable
                bctx.fillStyle = 'rgba(255, 250, 170, 0.12)';
                for (const c of info) {
                    if (c.interactive) bctx.fill(c.path);
                }

                // f. cut to land
                bctx.globalCompositeOperation = 'destination-in';
                bctx.fillStyle = '#000';
                bctx.fill(landUnion);
                bctx.globalCompositeOperation = 'source-over';

                // g. lakes
                const LAKES = [[-87.5,47.6,2.6,0.8],[-87,44,0.7,1.8],[-82.3,44.8,1.0,1.3],[-81.2,42.2,1.6,0.4],[-77.8,43.7,1.2,0.35],[33,-1,1.3,1.3],[-121,66,1.5,0.8],[-114,61.7,2.0,0.6],[-97.5,52.5,0.6,1.5],[108,53.5,0.5,2.2]];
                const lakeRx = TW / 360, lakeRy = TH / 180;
                bctx.globalCompositeOperation = 'destination-out';
                for (const L of LAKES) {
                    const p = landProj([L[0], L[1]]);
                    bctx.beginPath();
                    bctx.ellipse(p[0], p[1], L[2] * lakeRx, L[3] * lakeRy, 0, 0, Math.PI * 2);
                    bctx.fill();
                }
                bctx.globalCompositeOperation = 'source-over';

                // h. rivers
                const RIVERS = [
                    [[-73,-4.5],[-67,-3],[-60,-3.2],[-55,-2.2],[-50.5,-0.5]],
                    [[32.5,2],[31.5,10],[32.5,15.6],[33.5,18.5],[31,22],[32.7,25.5],[31.2,30],[31,31.4]],
                    [[-93.5,45],[-91,41],[-90,37],[-91,33],[-90,29.5]],
                    [[97,33],[102,27.5],[106.5,29.5],[111.5,30.5],[116,30],[121,31.5]],
                    [[9,48.2],[13.5,48.5],[17,48],[19,46],[22.5,44.5],[28,45.2]],
                    [[36,57],[44,56.3],[49,55.5],[46,50],[48,46]]
                ];
                const riverPath = new Path2D();
                d3.geoPath(landProj, riverPath)({ type: 'MultiLineString', coordinates: RIVERS });
                bctx.lineCap = 'round';
                bctx.lineJoin = 'round';
                bctx.strokeStyle = '#4f9bd6';
                bctx.lineWidth = 4 * k;
                bctx.stroke(riverPath);

                // i. interior borders
                const borderPath = new Path2D();
                d3.geoPath(landProj, borderPath)(topojson.mesh(world, world.objects.countries, (a, b) => a !== b));
                bctx.strokeStyle = 'rgba(40, 30, 20, 0.35)';
                bctx.lineWidth = 1.5 * k;
                bctx.stroke(borderPath);

                // Warm inner rim on interactive countries (clipped so it stays inside them)
                bctx.strokeStyle = 'rgba(240, 201, 82, 0.6)';
                bctx.lineWidth = 8 * k;
                for (const c of info) {
                    if (!c.interactive) continue;
                    bctx.save();
                    bctx.clip(c.path);
                    bctx.stroke(c.path);
                    bctx.restore();
                }

                // j. coast ink (exterior boundaries only) + lake outlines
                const coastPath = new Path2D();
                d3.geoPath(landProj, coastPath)(topojson.mesh(world, world.objects.countries, (a, b) => a === b));
                bctx.strokeStyle = '#2a1c10';
                bctx.lineWidth = 3 * k;
                bctx.stroke(coastPath);
                for (const L of LAKES) {
                    const p = landProj([L[0], L[1]]);
                    bctx.beginPath();
                    bctx.ellipse(p[0], p[1], L[2] * lakeRx, L[3] * lakeRy, 0, 0, Math.PI * 2);
                    bctx.stroke();
                }
            }

            // ---- Live land canvas: base + gold highlight ----
            const landCanvas = document.createElement('canvas');
            landCanvas.width = TW;
            landCanvas.height = TH;
            const lctx = landCanvas.getContext('2d');

            function drawLand() {
                lctx.globalCompositeOperation = 'source-over';
                lctx.clearRect(0, 0, TW, TH);
                lctx.drawImage(landBase, 0, 0);
                if (hoverRegion || viewingRegion) {
                    lctx.globalCompositeOperation = 'source-atop';
                    lctx.fillStyle = 'rgba(212, 175, 55, 0.72)';
                    lctx.strokeStyle = '#f0c952';
                    lctx.lineWidth = 2 * k;
                    lctx.lineJoin = 'round';
                    for (let i = 0; i < info.length; i++) {
                        const c = info[i];
                        if (!(c.interactive && (c.region === hoverRegion || c.region === viewingRegion))) continue;
                        lctx.fill(c.path);
                        lctx.stroke(c.path);
                    }
                    lctx.globalCompositeOperation = 'source-over';
                }
                landTexture.needsUpdate = true;
            }

            const landTexture = new THREE.CanvasTexture(landCanvas);
            landTexture.colorSpace = THREE.SRGBColorSpace;
            landTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            drawLand();

            // ---- Sea sphere, wave marks, land shells, ink outline, atmosphere ----
            const sea = new THREE.Mesh(
                new THREE.SphereGeometry(1, 96, 64),
                new THREE.MeshToonMaterial({ map: seaTexture, gradientMap })
            );
            scene.add(sea);

            // Wave marks on their own slowly drifting transparent sphere
            const WW = 2048, WH = 1024;
            const waveCanvas = document.createElement('canvas');
            waveCanvas.width = WW;
            waveCanvas.height = WH;
            {
                const wctx = waveCanvas.getContext('2d');
                const waveProj = d3.geoEquirectangular().fitSize([WW, WH], { type: 'Sphere' });
                const wr = mulberry32(777004);
                wctx.strokeStyle = 'rgba(255,255,255,0.6)';
                wctx.lineWidth = 2.6;
                wctx.lineCap = 'round';
                wctx.lineJoin = 'round';
                const isOcean = (lon, lat) => {
                    const px = Math.min(PW - 1, Math.max(0, Math.floor(((lon + 180) / 360) * PW)));
                    const py = Math.min(PH - 1, Math.max(0, Math.floor(((90 - lat) / 180) * PH)));
                    const idx = (py * PW + px) * 4;
                    return pickData[idx] === 0 && pickData[idx + 1] === 0 && pickData[idx + 2] === 0;
                };
                for (let i = 0; i < 280; i++) {
                    const lat = Math.asin(2 * wr() - 1) / DEG;
                    const lon = wr() * 360 - 180;
                    if (Math.abs(lat) >= 66) continue;
                    const half = 1.6 / Math.cos(lat * DEG);
                    if (lon - half < -180 || lon + half > 180) continue;
                    if (!isOcean(lon, lat) || !isOcean(lon - half, lat) || !isOcean(lon + half, lat)) continue;
                    wctx.beginPath();
                    for (let j = 0; j <= 8; j++) {
                        const t = j / 8;
                        const p = waveProj([lon + (t - 0.5) * 2 * half, lat + 0.32 * Math.sin(2 * Math.PI * 1.5 * t)]);
                        if (j === 0) wctx.moveTo(p[0], p[1]); else wctx.lineTo(p[0], p[1]);
                    }
                    wctx.stroke();
                }
            }
            const waveTexture = new THREE.CanvasTexture(waveCanvas);
            waveTexture.colorSpace = THREE.SRGBColorSpace;
            const waveMaterial = new THREE.MeshBasicMaterial({ map: waveTexture, transparent: true, depthWrite: false });
            const waves = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 48), waveMaterial);
            waves.scale.setScalar(1.002);
            scene.add(waves);

            // Land body: stacked alpha-tested shells make a raised slab with earthy cliffs
            const shellGeo = new THREE.SphereGeometry(1, 96, 64);
            const topMaterial = new THREE.MeshToonMaterial({ map: landTexture, gradientMap, alphaTest: 0.5 });
            const cliffMaterial = new THREE.MeshBasicMaterial({ map: landTexture, color: 0x7a5a38, alphaTest: 0.5 });
            const SHELLS = 6;
            for (let i = 0; i < SHELLS; i++) {
                const shell = new THREE.Mesh(shellGeo, i === SHELLS - 1 ? topMaterial : cliffMaterial);
                shell.scale.setScalar(1.003 + (LAND_R - 1.003) * (i / (SHELLS - 1)));
                scene.add(shell);
            }

            const outline = new THREE.Mesh(
                new THREE.SphereGeometry(1, 64, 48),
                new THREE.MeshBasicMaterial({ color: 0x0b1530, side: THREE.BackSide })
            );
            outline.scale.setScalar(LAND_R * 1.012);
            scene.add(outline);

            const atmosphere = new THREE.Mesh(
                new THREE.SphereGeometry(1, 48, 32),
                new THREE.ShaderMaterial({
                    transparent: true,
                    depthWrite: false,
                    side: THREE.BackSide,
                    blending: THREE.AdditiveBlending,
                    vertexShader: `
                        varying vec3 vN;
                        varying vec3 vV;
                        void main() {
                            vN = normalize(normalMatrix * normal);
                            vec4 mv = modelViewMatrix * vec4(position, 1.0);
                            vV = normalize(-mv.xyz);
                            gl_Position = projectionMatrix * mv;
                        }`,
                    fragmentShader: `
                        varying vec3 vN;
                        varying vec3 vV;
                        void main() {
                            float f = dot(normalize(vN), normalize(vV));
                            float a = pow(clamp(-f * 2.6, 0.0, 1.0), 1.6) * 0.4;
                            gl_FragColor = vec4(0.45, 0.75, 1.0, a);
                        }`
                })
            );
            atmosphere.scale.setScalar(LAND_R * 1.10);
            scene.add(atmosphere);

            // ---- Mountains ----
            const peakGeometry = buildPeakGeometry();
            const outlineMaterial = new THREE.MeshBasicMaterial({ color: 0x2a1c10, side: THREE.BackSide });
            const rand = mulberry32(20240607);

            const GROUP_KEYS = ['Canada', 'United States of America', 'Japan', 'EU', 'none'];
            const groups = {};
            const placed = {};
            for (const key of GROUP_KEYS) placed[key] = [];

            const peaks = [];
            for (const range of RANGES) {
                peaks.length = 0;
                placeRangePeaks(range, rand, peaks);
                const key = range.region || 'none';
                for (const p of peaks) placed[key].push(p);
            }

            // Build per-instance base data: normal, yaw-rotated X and Z axes, radius, height
            const _n = new THREE.Vector3();
            const _t = new THREE.Vector3();
            const _b = new THREE.Vector3();
            const _x = new THREE.Vector3();
            const _z = new THREE.Vector3();
            const STRIDE = 11;
            const groupList = [];
            for (const key of GROUP_KEYS) {
                const list = placed[key];
                if (list.length === 0) continue;
                const data = new Float32Array(list.length * STRIDE);
                list.forEach((p, i) => {
                    lonLatToVec3(p.lon, p.lat, 1, _n);
                    if (Math.abs(_n.y) > 0.99) _t.set(1, 0, 0); else _t.set(0, 1, 0);
                    _t.cross(_n).normalize();          // tangent
                    _b.crossVectors(_n, _t);           // bitangent
                    const cy = Math.cos(p.yaw), sy = Math.sin(p.yaw);
                    _x.copy(_t).multiplyScalar(cy).addScaledVector(_b, sy);
                    _z.crossVectors(_x, _n);           // X x Y = Z (right-handed)
                    const o = i * STRIDE;
                    data[o] = _n.x; data[o + 1] = _n.y; data[o + 2] = _n.z;
                    data[o + 3] = _x.x; data[o + 4] = _x.y; data[o + 5] = _x.z;
                    data[o + 6] = _z.x; data[o + 7] = _z.y; data[o + 8] = _z.z;
                    data[o + 9] = p.radius;
                    data[o + 10] = p.height;
                });

                const material = new THREE.MeshToonMaterial({ vertexColors: true, gradientMap });
                const mesh = new THREE.InstancedMesh(peakGeometry, material, list.length);
                const ink = new THREE.InstancedMesh(peakGeometry, outlineMaterial, list.length);
                mesh.frustumCulled = false;
                ink.frustumCulled = false;
                scene.add(mesh);
                scene.add(ink);

                const grp = { key, data, count: list.length, mesh, ink, g: 1 };
                groups[key] = grp;
                groupList.push(grp);
            }

            const _m = new THREE.Matrix4();
            const _px = new THREE.Vector3();
            const _py = new THREE.Vector3();
            const _pz = new THREE.Vector3();
            const _pp = new THREE.Vector3();

            // Rebuild a group's instance matrices at growth factor g
            function writeMatrices(grp) {
                const g = grp.g;
                const rk = 1 + (g - 1) * 0.4;
                const d = grp.data;
                for (let i = 0; i < grp.count; i++) {
                    const o = i * STRIDE;
                    const r = d[o + 9] * rk;
                    const h = d[o + 10] * g;
                    _pp.set(d[o], d[o + 1], d[o + 2]).multiplyScalar(LAND_R - 0.6 * r * r);
                    _px.set(d[o + 3], d[o + 4], d[o + 5]).multiplyScalar(r);
                    _py.set(d[o], d[o + 1], d[o + 2]).multiplyScalar(h);
                    _pz.set(d[o + 6], d[o + 7], d[o + 8]).multiplyScalar(r);
                    _m.makeBasis(_px, _py, _pz).setPosition(_pp);
                    grp.mesh.setMatrixAt(i, _m);
                    _px.multiplyScalar(1.14);
                    _py.multiplyScalar(1.07);
                    _pz.multiplyScalar(1.14);
                    _m.makeBasis(_px, _py, _pz).setPosition(_pp);
                    grp.ink.setMatrixAt(i, _m);
                }
                grp.mesh.instanceMatrix.needsUpdate = true;
                grp.ink.instanceMatrix.needsUpdate = true;
            }
            for (const grp of groupList) writeMatrices(grp);

            // ---- Trees (small low-poly cones; no ink twin, no hover reaction) ----
            {
                const N = 5;
                const pos = [], col = [];
                for (let i = 0; i < N; i++) {
                    const a0 = (i / N) * Math.PI * 2, a1 = ((i + 1) / N) * Math.PI * 2;
                    // counter-clockwise seen from outside: base[j], base[i], apex
                    pos.push(Math.cos(a1), 0, Math.sin(a1), Math.cos(a0), 0, Math.sin(a0), 0, 1, 0);
                    col.push(0.75, 0.75, 0.75, 0.75, 0.75, 0.75, 1, 1, 1);
                }
                const treeGeo = new THREE.BufferGeometry();
                treeGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
                treeGeo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
                treeGeo.computeVertexNormals();

                const tr = mulberry32(777005);
                const TREE_SPEC = {
                    taiga: { p: 0.55, h0: 0.016, h1: 0.024, rk: 0.38, colour: '#2f6b3a' },
                    jungle: { p: 0.6, h0: 0.012, h1: 0.017, rk: 0.75, colour: '#3c9a4a' },
                    temperate: { p: 0.14, h0: 0.012, h1: 0.018, rk: 0.55, colour: '#4f9440' }
                };
                const trees = [];
                for (let i = 0; i < 9000 && trees.length < 1500; i++) {
                    const lat = Math.asin(2 * tr() - 1) / DEG;
                    const lon = tr() * 360 - 180;
                    const roll = tr();
                    const yaw = tr() * Math.PI * 2;
                    const sizeR = tr();
                    const jit = 1 + (tr() * 2 - 1) * 0.08;
                    const px = Math.min(PW - 1, Math.max(0, Math.floor(((lon + 180) / 360) * PW)));
                    const py = Math.min(PH - 1, Math.max(0, Math.floor(((90 - lat) / 180) * PH)));
                    const idx = (py * PW + px) * 4;
                    const id = (pickData[idx] << 16) | (pickData[idx + 1] << 8) | pickData[idx + 2];
                    if (id < 1 || id > features.length || info[id - 1].ice) continue;
                    const spec = TREE_SPEC[biomeAt(lon, lat)];
                    if (!spec || roll >= spec.p) continue;
                    trees.push({ lon, lat, yaw, spec, h: spec.h0 + (spec.h1 - spec.h0) * sizeR, jit });
                }

                const treeMesh = new THREE.InstancedMesh(
                    treeGeo,
                    new THREE.MeshToonMaterial({ vertexColors: true, gradientMap }),
                    Math.max(1, trees.length)
                );
                treeMesh.count = trees.length;
                treeMesh.frustumCulled = false;
                const _tc = new THREE.Color();
                trees.forEach((t, i) => {
                    lonLatToVec3(t.lon, t.lat, 1, _n);
                    if (Math.abs(_n.y) > 0.99) _t.set(1, 0, 0); else _t.set(0, 1, 0);
                    _t.cross(_n).normalize();
                    _b.crossVectors(_n, _t);
                    const cy = Math.cos(t.yaw), sy = Math.sin(t.yaw);
                    _x.copy(_t).multiplyScalar(cy).addScaledVector(_b, sy);
                    _z.crossVectors(_x, _n);
                    const r = t.h * t.spec.rk;
                    _px.copy(_x).multiplyScalar(r);
                    _py.copy(_n).multiplyScalar(t.h);
                    _pz.copy(_z).multiplyScalar(r);
                    _pp.copy(_n).multiplyScalar(LAND_R - 0.001);
                    _m.makeBasis(_px, _py, _pz).setPosition(_pp);
                    treeMesh.setMatrixAt(i, _m);
                    _tc.set(t.spec.colour).multiplyScalar(t.jit);
                    treeMesh.setColorAt(i, _tc);
                });
                treeMesh.instanceMatrix.needsUpdate = true;
                if (treeMesh.instanceColor) treeMesh.instanceColor.needsUpdate = true;
                scene.add(treeMesh);
            }

            // ---- Map pins (floating markers over the four clickable regions) ----
            // [lon, lat, altitude]; altitude = gap between land surface and the pin tip
            const PINS = {
                'Canada': [-99, 57, 0.035],
                'United States of America': [-96, 39, 0.035],
                'EU': [3, 47.5, 0.035],
                'Japan': [139.6, 36.3, 0.17] // floats above Japan's peaks
            };
            const PIN_SIZE = 0.075;       // world height of the pin
            const PIN_HEAD_OFFSET = 0.058; // tip -> head centre, world units
            const PIN_HIT_PX = 20;
            const PIN_NEAR_SIDE = 0.12;
            const PIN_PULSE_SECONDS = 2.2;

            // One shared non-indexed pin: tip at y = 0, 6-sided cone widening to the head
            const pinGeometry = (() => {
                const pos = [];
                const N = 6, ringY = 0.62, ringR = 0.42;
                for (let i = 0; i < N; i++) {
                    const a0 = (i / N) * Math.PI * 2, a1 = ((i + 1) / N) * Math.PI * 2;
                    // counter-clockwise seen from outside: tip, ring[i], ring[i+1]
                    pos.push(0, 0, 0,
                        ringR * Math.cos(a0), ringY, ringR * Math.sin(a0),
                        ringR * Math.cos(a1), ringY, ringR * Math.sin(a1));
                }
                const head = new THREE.IcosahedronGeometry(0.5, 0); // already non-indexed
                const hp = head.getAttribute('position').array;
                for (let i = 0; i < hp.length; i += 3) pos.push(hp[i], hp[i + 1] + 0.78, hp[i + 2]);
                head.dispose();
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
                geo.computeVertexNormals();
                return geo;
            })();
            const pinInkMaterial = new THREE.MeshBasicMaterial({ color: 0x2a1c10, side: THREE.BackSide });
            const PIN_UP = new THREE.Vector3(0, 1, 0);
            const PIN_Z = new THREE.Vector3(0, 0, 1);
            const ringGeometry = new THREE.RingGeometry(0.72, 1, 32);
            const pins = [];
            Object.keys(PINS).forEach((region, i) => {
                const [lon, lat, alt] = PINS[region];
                const normal = lonLatToVec3(lon, lat, 1, new THREE.Vector3()).normalize();

                // Group aligned to the surface normal; holder carries the unit pin and spins
                const group = new THREE.Group();
                group.quaternion.setFromUnitVectors(PIN_UP, normal);
                const holder = new THREE.Group();
                holder.scale.setScalar(PIN_SIZE);
                const bodyMat = new THREE.MeshToonMaterial({
                    color: 0xf0c952, gradientMap, emissive: 0xd4af37, emissiveIntensity: 0.25
                });
                const body = new THREE.Mesh(pinGeometry, bodyMat);
                const ink = new THREE.Mesh(pinGeometry, pinInkMaterial);
                ink.scale.setScalar(1.12);
                ink.position.y = -0.64 * 0.12; // scale about the pin's centre, not its tip
                holder.add(ink);
                holder.add(body);
                group.add(holder);
                group.position.copy(normal).multiplyScalar(LAND_R + alt);
                scene.add(group);

                // Ground pulse ring lying on the land surface
                const ringMat = new THREE.MeshBasicMaterial({
                    color: 0xf0c952, transparent: true, depthWrite: false, side: THREE.DoubleSide
                });
                const ring = new THREE.Mesh(ringGeometry, ringMat);
                ring.quaternion.setFromUnitVectors(PIN_Z, normal);
                ring.position.copy(normal).multiplyScalar(LAND_R + 0.003);
                ring.scale.setScalar(0.04);
                scene.add(ring);

                // Floating pins get a thin string down to the land
                if (alt > 0.1) {
                    const len = alt + 0.005;
                    const string = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.0025, 0.0025, len, 6),
                        new THREE.MeshBasicMaterial({ color: 0x2a1c10 })
                    );
                    string.quaternion.setFromUnitVectors(PIN_UP, normal);
                    string.position.copy(normal).multiplyScalar(LAND_R + len / 2);
                    scene.add(string);
                }

                pins.push({
                    region, normal, alt, group, holder, bodyMat, ring, ringMat,
                    phase: i * 1.7, s: 1,
                    // same shape as an info[] entry, so hover/click treat it like a country
                    info: { name: region, region, label: region === 'EU' ? 'EU' : region, interactive: true, ice: false }
                });
            });

            // ---- Controls ----
            const controls = new OrbitControls(camera, canvas);
            controls.enablePan = false;
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.rotateSpeed = 0.6;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.6;

            const reduceMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
            let userActive = false;
            let lastInteract = -Infinity;
            let fly = null; // camera tween toward a region

            controls.addEventListener('start', () => {
                userActive = true;
                fly = null;
            });
            controls.addEventListener('end', () => {
                userActive = false;
                lastInteract = performance.now();
            });

            function canAutoRotate(now) {
                if (reduceMotionQuery.matches) return false;
                if (fly || userActive) return false;
                if (now - lastInteract < 4000) return false;
                if (viewingRegion || polaroidContainer.childElementCount > 0) return false;
                if (hoverRegion) return false;
                return true;
            }

            // Slerp the camera direction so a region's focus point faces the viewer
            const _d1 = new THREE.Vector3();
            function flyTo(region) {
                const focus = FOCUS_POINTS[region];
                if (!focus) return;
                const dist = camera.position.length();
                const d0 = camera.position.clone().normalize();
                lonLatToVec3(focus[0], focus[1], 1, _d1);
                fly = {
                    t0: performance.now(),
                    dur: 700,
                    d0,
                    dist,
                    q: new THREE.Quaternion().setFromUnitVectors(d0, _d1)
                };
            }
            const _qTmp = new THREE.Quaternion();
            const _qId = new THREE.Quaternion();

            // ---- Picking: id canvas + ray/sphere ----

            const raycaster = new THREE.Raycaster();
            const _ndc = new THREE.Vector2();
            const _hit = new THREE.Vector3();

            // Screen point -> country info under it (or null for ocean / off-globe)
            function pick(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                if (!rect.width || !rect.height) return null;
                _ndc.set(((clientX - rect.left) / rect.width) * 2 - 1, -((clientY - rect.top) / rect.height) * 2 + 1);
                camera.updateMatrixWorld();
                raycaster.setFromCamera(_ndc, camera);
                const o = raycaster.ray.origin, dir = raycaster.ray.direction;
                const b = o.dot(dir);
                const disc = b * b - (o.lengthSq() - LAND_R * LAND_R);
                if (disc < 0) return null;
                const t = -b - Math.sqrt(disc);
                if (t < 0) return null;
                _hit.copy(dir).multiplyScalar(t).add(o);
                const ll = vec3ToLonLat(_hit);
                const px = Math.min(PW - 1, Math.max(0, Math.floor(((ll[0] + 180) / 360) * PW)));
                const py = Math.min(PH - 1, Math.max(0, Math.floor(((90 - ll[1]) / 180) * PH)));
                const idx = (py * PW + px) * 4;
                const id = (pickData[idx] << 16) | (pickData[idx + 1] << 8) | pickData[idx + 2];
                if (id < 1 || id > features.length) return null;
                if (!d3.geoContains(features[id - 1], ll)) return null;
                return info[id - 1];
            }

            // Pin under the pointer (screen-space hit test on the pin head), or null
            const _pinV = new THREE.Vector3();
            const _camDir = new THREE.Vector3();
            function pickPin(clientX, clientY) {
                const rect = canvas.getBoundingClientRect();
                if (!rect.width || !rect.height) return null;
                camera.updateMatrixWorld();
                _camDir.copy(camera.position).normalize();
                let best = null, bestD = PIN_HIT_PX;
                for (let i = 0; i < pins.length; i++) {
                    const pin = pins[i];
                    if (pin.normal.dot(_camDir) <= PIN_NEAR_SIDE) continue;
                    _pinV.copy(pin.group.position).addScaledVector(pin.normal, PIN_HEAD_OFFSET).project(camera);
                    const sx = rect.left + (_pinV.x * 0.5 + 0.5) * rect.width;
                    const sy = rect.top + (-_pinV.y * 0.5 + 0.5) * rect.height;
                    const d = Math.hypot(sx - clientX, sy - clientY);
                    if (d <= bestD) { bestD = d; best = pin; }
                }
                return best ? best.info : null;
            }

            // Pins win over the country underneath
            function pickTarget(clientX, clientY) {
                return pickPin(clientX, clientY) || pick(clientX, clientY);
            }

            // ---- Pointer handling ----
            let pDown = null;       // { x, y, t } while a primary pointer is held
            let dragging = false;
            let pointerInside = false;
            let mouseX = 0, mouseY = 0;
            let needsPick = false;
            let hoverLabel = '';

            function updateCursor() {
                canvas.style.cursor = dragging ? 'grabbing' : hoverRegion ? 'pointer' : 'grab';
            }

            function applyHover(c) {
                const label = c ? c.label : '';
                if (label !== hoverLabel) {
                    hoverLabel = label;
                    if (label) tooltip.text(label).classed('active', true);
                    else tooltip.classed('active', false);
                }
                setHoverRegion(c && c.interactive ? c.region : null);
                updateCursor();
            }

            canvas.addEventListener('pointerdown', (e) => {
                if (e.button !== 0) return;
                pDown = { x: e.clientX, y: e.clientY, t: performance.now() };
                dragging = false;
                if (e.pointerType !== 'touch') mouseX = e.clientX, mouseY = e.clientY;
            });

            canvas.addEventListener('pointermove', (e) => {
                if (pDown && !dragging && Math.hypot(e.clientX - pDown.x, e.clientY - pDown.y) >= 6) {
                    dragging = true;
                    applyHover(null);
                }
                if (e.pointerType === 'touch') return;
                mouseX = e.clientX;
                mouseY = e.clientY;
                pointerInside = true;
                tooltip
                    .style("left", (e.clientX + 15) + "px")
                    .style("top", (e.clientY + 15) + "px");
                if (!pDown) needsPick = true;
                updateCursor();
            });

            canvas.addEventListener('pointerup', (e) => {
                if (e.button !== 0 || !pDown) return;
                const isClick = !dragging &&
                    Math.hypot(e.clientX - pDown.x, e.clientY - pDown.y) < 6 &&
                    performance.now() - pDown.t < 500;
                pDown = null;
                dragging = false;
                needsPick = e.pointerType !== 'touch';
                if (isClick) {
                    const c = pickTarget(e.clientX, e.clientY);
                    if (c && c.interactive) {
                        flyTo(c.region);
                        scatterPolaroids(c.region);
                    }
                }
                updateCursor();
            });

            canvas.addEventListener('pointercancel', () => {
                pDown = null;
                dragging = false;
                updateCursor();
            });

            canvas.addEventListener('pointerleave', () => {
                pointerInside = false;
                needsPick = false;
                applyHover(null);
            });

            // ---- Resize ----
            const FIT_RADIUS = 1.12; // globe plus peaks/pins margin
            let prevFit = 0;
            function fitDistance() {
                const halfV = THREE.MathUtils.degToRad(camera.fov / 2);
                const halfH = Math.atan(Math.tan(halfV) * camera.aspect);
                return FIT_RADIUS / Math.sin(Math.min(halfV, halfH));
            }
            function resize() {
                const w = globeEl.clientWidth, h = globeEl.clientHeight;
                if (!w || !h) return;
                renderer.setSize(w, h, false);
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                const newFit = fitDistance();
                const dist = camera.position.length();
                const target = prevFit ? dist * (newFit / prevFit) : newFit;
                if (dist > 0) camera.position.multiplyScalar(target / dist);
                controls.minDistance = newFit * 0.5;
                controls.maxDistance = newFit * 1.6;
                prevFit = newFit;
                controls.update();
            }
            new ResizeObserver(resize).observe(globeEl);
            resize();

            // ---- Render loop ----
            let raf = 0;
            let lastT = performance.now();

            function frame(now) {
                raf = requestAnimationFrame(frame);
                const dt = Math.min(0.1, (now - lastT) / 1000);
                lastT = now;

                if (fly) {
                    const t = Math.min(1, (now - fly.t0) / fly.dur);
                    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
                    _qTmp.copy(_qId).slerp(fly.q, e);
                    camera.position.copy(fly.d0).applyQuaternion(_qTmp).multiplyScalar(fly.dist);
                    if (t >= 1) {
                        fly = null;
                        lastInteract = now;
                    }
                }

                controls.autoRotate = canAutoRotate(now);
                const moved = controls.update();

                if ((moved || needsPick) && pointerInside && !pDown) {
                    needsPick = false;
                    applyHover(pickTarget(mouseX, mouseY));
                }

                if (landDirty) {
                    landDirty = false;
                    drawLand();
                }

                // Ease each region's peaks toward their hover/viewing size
                for (const grp of groupList) {
                    if (grp.key === 'none') continue;
                    const target = (grp.key === hoverRegion || grp.key === viewingRegion) ? GROW_TARGET : 1;
                    if (grp.g === target) continue;
                    grp.g += (target - grp.g) * Math.min(1, dt * 8);
                    if (Math.abs(target - grp.g) < 0.002) grp.g = target;
                    writeMatrices(grp);
                    grp.mesh.material.emissive.setHex(GOLD_HEX).multiplyScalar((grp.g - 1) / 0.45 * 0.35);
                }

                // Pins: bob, spin, ground pulse, hover/viewing emphasis
                {
                    const reduce = reduceMotionQuery.matches;
                    const tSec = now / 1000;
                    for (let i = 0; i < pins.length; i++) {
                        const pin = pins[i];
                        if (reduce) {
                            pin.group.position.copy(pin.normal).multiplyScalar(LAND_R + pin.alt);
                            pin.ring.scale.setScalar(0.04);
                            pin.ringMat.opacity = 0.5;
                        } else {
                            const bob = 0.010 * (0.5 + 0.5 * Math.sin(tSec * 2.2 + pin.phase));
                            pin.group.position.copy(pin.normal).multiplyScalar(LAND_R + pin.alt + bob);
                            pin.holder.rotation.y += dt * 0.8;
                            const ph = ((tSec + pin.phase) / PIN_PULSE_SECONDS) % 1;
                            pin.ring.scale.setScalar(0.02 + 0.04 * ph);
                            pin.ringMat.opacity = 0.75 * (1 - ph);
                        }
                        const target = (pin.region === hoverRegion || pin.region === viewingRegion) ? 1.35 : 1;
                        if (pin.s !== target) {
                            pin.s += (target - pin.s) * Math.min(1, dt * 8);
                            if (Math.abs(target - pin.s) < 0.002) pin.s = target;
                            pin.group.scale.setScalar(pin.s);
                            pin.bodyMat.emissiveIntensity = 0.25 + (pin.s - 1) / 0.35 * 0.35;
                        }
                    }
                }

                if (!reduceMotionQuery.matches) {
                    waves.rotation.y += dt * 0.006;
                    waveMaterial.opacity = 0.62 + 0.22 * Math.sin(now / 1000 * 0.9);
                }

                renderer.render(scene, camera);
            }

            function startLoop() {
                if (raf) return;
                lastT = performance.now();
                raf = requestAnimationFrame(frame);
            }

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    cancelAnimationFrame(raf);
                    raf = 0;
                } else {
                    startLoop();
                }
            });
            if (!document.hidden) startLoop();
        }

        initGlobe().catch((error) => {
            console.error('Globe failed to start:', error);
        });
    </script>
</body>
</html>
